      - {name: SoftwareRevision, from: SoftwareRevision, meaning: "גרסת תוכנה של הרכיב"}
    rules: [key_not_null, key_unique, required, ref]
    owner: {proposed: "SolarWinds קובע Serial, גרסה וכרטיסים (IP)", status: טרם אושר, ref: "שלב ב' §5"}
    frequency: {proposed: "פעם ביום, ושינויים כל שעה", ref: "שלב ב' §7 (רכיבים, חומרה, גרסאות)"}

