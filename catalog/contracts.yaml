# Data contracts – stage B, SolarWinds side only (docs/SPEC-B.md §4, §6, §9, §13.1).
#
# One contract per canonical entity. It reads the rows of ONE query probe in checks.yaml and says how they
# become our format. Every change is shown next to the raw row (swcheck/pipeline.py); the raw query log is
# never modified.
#   stable_id   canonical fields that identify a record inside one instance. The full ID adds network and instance:
#               <network_id>/<host:port>/<SWIS entity>/<field=value;...>  (local NodeID is not global, §6)
#   fields      name      canonical name (ours)
#               from      the field name in the probe rows (the logical name in checks.yaml)
#               required  true -> a null or empty value breaks rule "required"
#               ref       canonical entity whose stable_id this value must match in the same run
#               unit      unit of the value as SWIS returns it. Declared only, never converted.
#               tz        utc | server_local. Only then is a time written as UTC ("...Z"). Not used today:
#                         every time is kept exactly as received (user decision, 2026-11-04).
#               enum      {map: {code: label}, doc: URL}. Without doc the mapping is not allowed.
#               meaning   what the field means, in Hebrew
#               basis     where the meaning/unit/tz comes from. Missing = "טעון הוכחה".
#   derived     extra fields computed from a canonical field (the source field stays as received)
#   rules       key_not_null, key_unique, required, ref, enum. A record that breaks one goes to the
#               dead-letter queue with the rule; nothing is dropped. Empty fields (null or "") are marked on
#               the record and counted, without rejecting it.
#   owner       the SolarWinds side of SPEC-B §5 (status: טרם אושר until the workshop approves it)
#   frequency   proposal from SPEC-B §7 (to be verified against the API)
#
# Only entities that SolarWinds feeds are listed. Entities from other systems (§4) are out of scope.

version: 1
status: טיוטה – ממתין לאישור משמעויות

contracts:
  - entity: Device
    title: רכיב
    spec: "שלב ב' §4, §6; שלב א' #2"
    source: {check: 2, probe: nodes}
    stable_id: [NodeID]
    fields:
      - {name: NodeID, from: NodeID, required: true, meaning: מזהה הרכיב במופע Orion (מקומי, לא גלובלי),
         basis: https://solarwinds.github.io/OrionSDK/2026.2/schema/Orion.Nodes.html}
      - {name: Caption, from: Caption, meaning: שם הרכיב כפי שמוצג ב־SolarWinds}
      - {name: IPAddress, from: IPAddress, meaning: כתובת הניהול של הרכיב}
      - {name: Vendor, from: Vendor, meaning: יצרן}
      - {name: MachineType, from: MachineType, meaning: דגם / סוג מכונה}
      - {name: SoftwareVersion, from: SoftwareVersion, meaning: גרסת תוכנה}
      - {name: Status, from: Status, meaning: קוד מצב הרכיב (Integer; המיפוי לפי הגרסה – טעון הוכחה)}
      - {name: ObjectSubType, from: ObjectSubType, meaning: שיטת הניטור (SNMP / ICMP / Agent ...)}
      - {name: SysName, from: SysName, meaning: sysName של הרכיב}
      - {name: Location, from: Location, meaning: sysLocation כפי שנאסף}
      - {name: EngineID, from: EngineID, meaning: מנוע האיסוף שמנטר את הרכיב}
      - {name: LastBoot, from: LastBoot, meaning: זמן האתחול האחרון}
      - {name: SystemUpTime, from: SystemUpTime, meaning: זמן פעילות מאז האתחול (יחידות – טעון הוכחה)}
      - {name: LastSync, from: LastSync, meaning: זמן האיסוף האחרון מהרכיב}
      - {name: MinutesSinceLastSync, from: MinutesSinceLastSync, unit: minutes,
         meaning: דקות מאז האיסוף האחרון, basis: "שם השדה בסכמה (Orion.Nodes)"}
    rules: [key_not_null, key_unique, required]
    owner: {proposed: "SolarWinds קובע Serial, גרסה וכרטיסים (IP); שם ותפקיד – SolarWinds מדווח",
            status: טרם אושר, ref: "שלב ב' §5"}
    frequency: {proposed: "פעם ביום, ושינויים כל שעה", ref: "שלב ב' §7"}

  - entity: NcmNode
