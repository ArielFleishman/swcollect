      - {name: SrcInterfaceID, from: SrcInterfaceID, ref: Interface, meaning: ממשק המקור (אם הקשר ברמת ממשק)}
      - {name: DestNodeID, from: DestNodeID, required: true, ref: Device, meaning: רכיב היעד של הקשר}
      - {name: DestInterfaceID, from: DestInterfaceID, ref: Interface, meaning: ממשק היעד (אם הקשר ברמת ממשק)}
      - {name: SrcType, from: SrcType, meaning: סוג אובייקט המקור}
      - {name: DestType, from: DestType, meaning: סוג אובייקט היעד}
      - {name: LayerType, from: LayerType, meaning: שכבת הקשר (L2 / L3 ...)}
      - {name: DataSourceNodeID, from: DataSourceNodeID, meaning: הרכיב שממנו נלמד הקשר}
      - {name: LastUpdateUtc, from: LastUpdateUtc, meaning: עדכון אחרון של הקשר}
    rules: [key_not_null, key_unique, required, ref]
    owner: {proposed: "SolarWinds נצפה", status: טרם אושר, ref: "שלב ב' §5 (קישור IP)"}
    frequency: {proposed: "כל שעה", ref: "שלב ב' §7 (טופולוגיה)"}

  - entity: LldpNeighbor
