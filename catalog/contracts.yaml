    source: {check: 11, probe: ncm_nodes}
    stable_id: [NcmNodeID]
    fields:
      - {name: NcmNodeID, from: NodeID, required: true, meaning: מזהה הרכיב ב־NCM (GUID),
         basis: https://solarwinds.github.io/OrionSDK/2026.2/schema/Cirrus.Nodes.html}
      - {name: CoreNodeID, from: CoreNodeID, required: true, ref: Device, meaning: מזהה Orion המספרי של אותו רכיב,
         basis: https://solarwinds.github.io/OrionSDK/2026.2/schema/Cirrus.Nodes.html}
      - {name: NodeCaption, from: NodeCaption, meaning: שם הרכיב ב־NCM}
      - {name: ConnectionProfile, from: ConnectionProfile, meaning: פרופיל ההתחברות של NCM לרכיב}
    rules: [key_not_null, key_unique, required, ref]
    owner: {proposed: "SolarWinds NCM", status: טרם אושר, ref: "שלב ב' §5 (לא מוגדר במפורש)"}
    frequency: {proposed: "פעם ביום ובכל שינוי", ref: "שלב ב' §7 (תצורות)"}

  - entity: Interface
    title: ממשק
    spec: "שלב ב' §4, §6; שלב א' #2"
    source: {check: 2, probe: interfaces}
    stable_id: [InterfaceID]
    fields:
      - {name: InterfaceID, from: InterfaceID, required: true, meaning: מזהה הממשק במופע Orion,
         basis: https://solarwinds.github.io/OrionSDK/2026.2/schema/Orion.NPM.Interfaces.html}
      - {name: NodeID, from: NodeID, required: true, ref: Device, meaning: הרכיב שאליו שייך הממשק}
      - {name: Name, from: Name, meaning: שם הממשק כפי שמוצג (למשל GigabitEthernet0/0/1)}
      - {name: Alias, from: Alias, meaning: התיאור המוגדר על הפורט (ifAlias)}
      - {name: Type, from: Type, meaning: קוד סוג הממשק (ifType)}
      - {name: Speed, from: Speed, meaning: מהירות הממשק (יחידות – טעון הוכחה מול מסך הממשק)}
      - {name: AdminStatus, from: AdminStatus, meaning: מצב מנהלתי (קוד; המיפוי – טעון הוכחה)}
      - {name: OperStatus, from: OperStatus, meaning: מצב תפעולי (קוד; המיפוי – טעון הוכחה)}
      - {name: MTU, from: MTU, meaning: MTU של הממשק}
      - {name: IfName, from: IfName, meaning: ifName}
      - {name: Index, from: Index, meaning: ifIndex}
      - {name: PhysicalAddress, from: PhysicalAddress, meaning: כתובת MAC}
      - {name: LastChange, from: LastChange, meaning: זמן השינוי האחרון במצב הממשק}
    derived:
      - {name: NameNormalized, from: Name, transform: interface_name,
         meaning: "שם ממשק מנורמל לפי טבלת קיצורים (§6). להתאמה עתידית בין מקורות בלבד, לא להוכחת קליטה."}
    rules: [key_not_null, key_unique, required, ref]
    owner: {proposed: "מצב: SolarWinds קובע (IP)", status: טרם אושר, ref: "שלב ב' §5 (מצב ומדדים)"}
    frequency: {proposed: "כל שעה", ref: "שלב ב' §7"}

