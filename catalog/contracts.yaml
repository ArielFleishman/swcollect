      - {name: RemoteSystemName, from: RemoteSystemName, meaning: שם הרכיב השכן כפי שדווח ב־CDP}
      - {name: RemotePort, from: RemotePort, meaning: הפורט בצד השכן}
      - {name: RemoteIP, from: RemoteIP, meaning: כתובת השכן}
    rules: [key_not_null, key_unique, required, ref]
