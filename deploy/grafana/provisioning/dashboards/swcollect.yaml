# The swcollect dashboards, generated by `swcollect dashboards` into deploy/grafana/dashboards (mounted read-only).
apiVersion: 1

providers:
  - name: swcollect
    folder: swcollect
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards/swcollect
