# swcollect stack. Every service sits on "swnet", an internal network with no route out, so a run
# here proves the whole system works without internet. Images are pinned; scripts/bundle_offline.ps1
# saves exactly these (plus the python base image of deploy/Dockerfile).
#
#   docker compose -f deploy/docker-compose.yml up -d                       # closed network (no host ports)
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d   # + ports on 127.0.0.1
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.e2e.yml ...      # the end-to-end check
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.hook.yml up -d  # real Orion pushes to :18090
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ui.yml up -d    # Grafana for operators on :13000
name: swcollect

x-swcollect: &swcollect
  image: swcollect:0.1.0
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  pull_policy: build
  networks: [swnet]

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: swcollect
      POSTGRES_PASSWORD: ${SWCOLLECT_PG_PASSWORD:-swcollect}
      POSTGRES_DB: swcollect
      SWCOLLECT_RO_PASSWORD: ${SWCOLLECT_RO_PASSWORD:-swcollect_ro}   # read-only role for Grafana (init-ro.sh)
    # No telemetry: the closed network has no route out, and nothing should try.
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/90-swcollect.sql:ro
      - ./init-ro.sh:/docker-entrypoint-initdb.d/91-swcollect-ro.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swcollect -d swcollect"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [swnet]

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
    networks: [swnet]

  # Mock SWIS (copied from swcheck) standing in for Orion on the test network. --rich: realistic rows for every
  # schema entity and 14 days of metric history (swcollect/mock/rich.py). The e2e pins the plain mock instead.
  mock:
    <<: *swcollect
    command: ["python", "-m", "swcollect", "mock", "--host", "0.0.0.0", "--port", "17774", "--rich"]

  # The collector service: every job on the schedule in catalog/collector.yaml, plus the push receiver on :18090.
  collector:
    <<: *swcollect
    depends_on:
      db: {condition: service_healthy}
      loki: {condition: service_started}
      mock: {condition: service_started}
    environment:
      SWCOLLECT_PG_DSN: postgresql://swcollect:${SWCOLLECT_PG_PASSWORD:-swcollect}@db:5432/swcollect
      SWCOLLECT_LOKI_URL: http://loki:3100
      SWCOLLECT_HOOK_TOKEN: ${SWCOLLECT_HOOK_TOKEN:-change-me}
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
      - reports:/app/reports
    command: ["python", "-m", "swcollect", "serve", "--network", "mock"]
    restart: unless-stopped

  # Dashboards over what swcollect stored (read-only: role swcollect_ro, and Loki). Provisioned from
  # deploy/grafana; the dashboards are generated by `swcollect dashboards`. Nothing is fetched from the internet:
  # no telemetry, no update or news checks, no plugin catalog or preinstalled plugins.
  grafana:
    image: grafana/grafana-oss:11.4.0
    depends_on:
      db: {condition: service_healthy}
      loki: {condition: service_started}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${SWCOLLECT_GRAFANA_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/swcollect/swc-overview.json
      SWCOLLECT_PG_DB: swcollect
      SWCOLLECT_RO_PASSWORD: ${SWCOLLECT_RO_PASSWORD:-swcollect_ro}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards/swcollect:ro
      - grafanadata:/var/lib/grafana
    networks: [swnet]

networks:
  swnet:
    internal: true

volumes:
  pgdata:
  lokidata:
  reports:
  grafanadata:
